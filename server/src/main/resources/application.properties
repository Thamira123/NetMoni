spring.application.name=NetMoni-Server

server.port=8080

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/netmoni}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.error.include-message=always

# Agent TCP server (local development only; TLS will be added with agent authentication)
netmoni.agent-server.host=127.0.0.1
netmoni.agent-server.port=9001
netmoni.agent.heartbeat-timeout-seconds=${AGENT_HEARTBEAT_TIMEOUT_SECONDS:90}
netmoni.agent.status-check-interval-ms=${AGENT_STATUS_CHECK_INTERVAL_MS:15000}
netmoni.notifications.email.enabled=${EMAIL_ALERTS_ENABLED:false}
netmoni.notifications.email.recipient=${ALERT_EMAIL_RECIPIENT:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
netmoni.security.jwt-secret=${JWT_SECRET}
netmoni.security.jwt-lifetime-seconds=${JWT_LIFETIME_SECONDS:3600}
netmoni.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
netmoni.security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
netmoni.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
netmoni.monitoring.high-response-time-ms=${HIGH_RESPONSE_TIME_THRESHOLD_MS:1000}
netmoni.websocket.allowed-origin=${WEBSOCKET_ALLOWED_ORIGIN:http://localhost:5173}
